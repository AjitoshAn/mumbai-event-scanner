<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मुंबई Events | Live Scanner</title>
    <meta name="description"
        content="Discover the best events in Mumbai - concerts, comedy shows, workshops & more. Sorted by distance from Thane West.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --saffron: #FF6B2C;
            --saffron-light: #FF8A50;
            --deep-purple: #4A0E78;
            --purple-glow: #7B2CBF;
            --gold: #FFD700;
            --gold-light: #FFE44D;
            --magenta: #E91E8C;
            --magenta-light: #FF4DA6;
            --teal: #00CED1;
            --teal-light: #20E3E6;
            --cream: #FFF8E7;
            --dark: #0A0A12;
            --dark-card: #12121F;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--dark);
            min-height: 100vh;
            color: var(--cream);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated gradient background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 80%, rgba(255, 107, 44, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 20%, rgba(233, 30, 140, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(74, 14, 120, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 70% 70%, rgba(0, 206, 209, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(15deg);
            }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        .particle:nth-child(1) {
            left: 10%;
            top: 20%;
            animation-delay: 0s;
            animation-duration: 18s;
        }

        .particle:nth-child(2) {
            left: 30%;
            top: 40%;
            animation-delay: 2s;
            animation-duration: 22s;
        }

        .particle:nth-child(3) {
            left: 50%;
            top: 60%;
            animation-delay: 4s;
            animation-duration: 16s;
        }

        .particle:nth-child(4) {
            left: 70%;
            top: 30%;
            animation-delay: 6s;
            animation-duration: 20s;
        }

        .particle:nth-child(5) {
            left: 90%;
            top: 70%;
            animation-delay: 8s;
            animation-duration: 24s;
        }

        .particle:nth-child(6) {
            left: 20%;
            top: 80%;
            animation-delay: 3s;
            animation-duration: 19s;
        }

        .particle:nth-child(7) {
            left: 80%;
            top: 10%;
            animation-delay: 5s;
            animation-duration: 21s;
        }

        .particle:nth-child(8) {
            left: 40%;
            top: 90%;
            animation-delay: 7s;
            animation-duration: 17s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.3;
            }

            25% {
                transform: translateY(-30px) translateX(15px) scale(1.2);
                opacity: 0.5;
            }

            50% {
                transform: translateY(-10px) translateX(-10px) scale(0.8);
                opacity: 0.2;
            }

            75% {
                transform: translateY(20px) translateX(20px) scale(1.1);
                opacity: 0.4;
            }
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* Glassmorphism Header */
        .header {
            text-align: center;
            padding: 50px 20px 40px;
            position: relative;
            margin-bottom: 20px;
        }

        .header::before {
            content: '✦ ✦ ✦';
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            font-size: 18px;
            color: var(--gold);
            letter-spacing: 20px;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 1;
                text-shadow: 0 0 10px var(--gold);
            }

            50% {
                opacity: 0.5;
                text-shadow: 0 0 20px var(--gold), 0 0 40px var(--saffron);
            }
        }

        .header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--saffron), var(--magenta), var(--gold), var(--teal));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 8s ease infinite;
            letter-spacing: -2px;
            margin-bottom: 5px;
        }

        @keyframes gradientFlow {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .header .subtitle {
            color: var(--teal);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .header .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .header .location-badge .dot {
            width: 8px;
            height: 8px;
            background: #22C55E;
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* Stats bar with enhanced glow */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(145deg, rgba(74, 14, 120, 0.3), rgba(13, 13, 26, 0.7));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.15);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--saffron), var(--magenta), var(--gold));
        }

        .stat-card .value {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Search and filter section */
        .search-section {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(15px);
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 20px 15px 55px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            color: var(--cream);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-input:focus {
            border-color: var(--magenta);
            box-shadow: 0 0 20px rgba(233, 30, 140, 0.2);
        }

        .sort-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 25px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            color: var(--cream);
            outline: none;
            cursor: pointer;
            min-width: 180px;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 5px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--saffron), var(--magenta));
            border-color: transparent;
            color: white;
            box-shadow: 0 5px 20px rgba(255, 107, 44, 0.3);
        }

        .filter-btn .count {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .filter-divider {
            width: 1px;
            height: 30px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 10px;
        }

        /* Source filter buttons */
        .source-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .source-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .source-btn.active {
            background: var(--teal);
            border-color: var(--teal);
            color: var(--dark);
            font-weight: 600;
        }

        /* Results info */
        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .results-count {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .results-count strong {
            color: var(--gold);
            font-weight: 600;
        }

        /* Event cards grid */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .event-card {
            background: linear-gradient(145deg, rgba(74, 14, 120, 0.25), rgba(18, 18, 31, 0.9));
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 0;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--saffron), var(--magenta), var(--gold));
            opacity: 0.8;
        }

        .event-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow:
                0 25px 50px rgba(255, 107, 44, 0.15),
                0 0 80px rgba(233, 30, 140, 0.1),
                inset 0 0 30px rgba(255, 215, 0, 0.03);
        }

        .event-card:hover::before {
            opacity: 1;
        }

        .card-header {
            padding: 20px 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .category-badge {
            background: linear-gradient(135deg, var(--saffron), var(--magenta));
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .source-badge {
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
        }

        .distance-badge {
            background: rgba(0, 206, 209, 0.2);
            color: var(--teal);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-body {
            padding: 15px 20px;
        }

        .event-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 12px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9rem;
        }

        .info-icon {
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .info-venue {
            color: var(--teal);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-date {
            color: var(--gold);
            font-weight: 500;
        }

        .card-footer {
            padding: 15px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
        }

        .event-price {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--saffron-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .book-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--saffron), var(--magenta));
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .book-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 44, 0.4);
        }

        .book-btn::after {
            content: '→';
            transition: transform 0.3s ease;
        }

        .book-btn:hover::after {
            transform: translateX(5px);
        }

        /* Coming Soon card variant */
        .event-card.coming-soon {
            background: linear-gradient(145deg, rgba(0, 206, 209, 0.1), rgba(18, 18, 31, 0.9));
            border-color: rgba(0, 206, 209, 0.2);
        }

        .event-card.coming-soon::before {
            background: linear-gradient(90deg, var(--teal), var(--purple-glow));
        }

        .event-card.coming-soon .book-btn {
            background: linear-gradient(135deg, var(--teal), var(--purple-glow));
        }

        .status-badge {
            background: var(--teal);
            color: var(--dark);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 50px 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 215, 0, 0.15);
            background: rgba(0, 0, 0, 0.3);
        }

        .footer .mandala {
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: spin 30s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .footer .tech-stack {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .footer .tech-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 20px 25px;
            }

            .stat-card .value {
                font-size: 2.2rem;
            }

            .search-bar {
                flex-direction: column;
            }

            .sort-select {
                width: 100%;
            }

            .filter-divider {
                display: none;
            }

            .filter-row {
                justify-content: center;
            }
        }

        /* Scroll to top button */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--saffron), var(--magenta));
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(255, 107, 44, 0.4);
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top:hover {
            transform: translateY(-5px);
        }

        /* Loading animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 215, 0, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spinner 1s linear infinite;
        }

        @keyframes spinner {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1>मुंबई Events</h1>
            <p class="subtitle">Live Event Scanner</p>
            <div class="location-badge">
                <span class="dot"></span>
                <span>Scanning from Thane West</span>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="value" id="total-count">--</div>
                <div class="label">Total Events</div>
            </div>
            <div class="stat-card">
                <div class="value" id="bms-count">--</div>
                <div class="label">BookMyShow</div>
            </div>
            <div class="stat-card">
                <div class="value" id="paytm-count">--</div>
                <div class="label">Paytm Insider</div>
            </div>
            <div class="stat-card">
                <div class="value" id="today-count">--</div>
                <div class="label">This Week</div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" id="search-input"
                        placeholder="Search events, artists, venues...">
                </div>
                <select class="sort-select" id="sort-select">
                    <option value="distance">Sort by Distance</option>
                    <option value="date">Sort by Date</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>

            <div class="filter-row">
                <span class="filter-label">Category:</span>
                <button class="filter-btn active" data-filter="all">All <span class="count"

        // State
        let currentFilter = 'all';
        let currentSource = 'all';
        let currentSearch = '';
        let currentSort = 'distance';

        function formatDistance(km) {
            if (km < 1) return `${Math.round(km * 1000)}m`;
            return `${km.toFixed(1)} km`;
        }

        function parsePrice(priceStr) {
            const match = priceStr.replace(/,/g, '').match(/\d+/);
            return match ? parseInt(match[0]) : 999999;
        }

        function parseDateForSort(dateStr) {
            const months = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
            const lower = dateStr.toLowerCase();
            for (const [m, num] of Object.entries(months)) {
                if (lower.includes(m)) {
                    const dayMatch = dateStr.match(/\d{1,2}/);
                    const day = dayMatch ? parseInt(dayMatch[0]) : 1;
                    return num * 100 + day;
                }
            }
            return 9999;
        }

        function isThisWeek(dateStr) {
            const today = new Date();
            const weekFromNow = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            const dateNum = parseDateForSort(dateStr);
            const currentMonth = today.getMonth() + 1;
            const targetMonth = Math.floor(dateNum / 100);
            const targetDay = dateNum % 100;

            if (targetMonth === currentMonth) {
                return targetDay >= today.getDate() && targetDay <= today.getDate() + 7;
            }
            return false;
        }

        function createEventCard(event) {
            const isComingSoon = event.status === 'Coming Soon';
            return `
                <div class="event-card ${isComingSoon ? 'coming-soon' : ''}" data-category="${event.category.toLowerCase()}" data-source="${event.source}">
                    <div class="card-header">
                        <div class="card-badges">
                            ${isComingSoon ? '<span class="status-badge">Coming Soon</span>' : ''}
                            <span class="category-badge">${event.category}</span>
                        </div>
                        <span class="distance-badge">📍 ${formatDistance(event.distance)}</span>
                    </div>
                    <div class="card-body">
                        <h3 class="event-title">${event.title}</h3>
                        <div class="event-info">
                            <div class="info-row">
                                <span class="info-icon">🏛️</span>
                                <span class="info-venue">${event.venue}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-icon">📅</span>
                                <span class="info-date">${event.date}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="event-price">${event.price}</span>
                        <a href="${event.url}" target="_blank" class="book-btn">${isComingSoon ? 'Notify' : 'Book'}</a>
                    </div>
                </div>
            `;
        }

        function filterAndSortEvents() {
            let filtered = [...eventsData];

            // Category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(e => e.category.toLowerCase() === currentFilter);
            }

            // Source filter
            if (currentSource !== 'all') {
                filtered = filtered.filter(e => e.source === currentSource);
            }

            // Search filter
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                filtered = filtered.filter(e =>
                    e.title.toLowerCase().includes(search) ||
                    e.venue.toLowerCase().includes(search) ||
                    e.category.toLowerCase().includes(search)
                );
            }

            // Sort
            switch (currentSort) {
                case 'distance':
                    filtered.sort((a, b) => a.distance - b.distance || parseDateForSort(a.date) - parseDateForSort(b.date));
                    break;
                case 'date':
                    filtered.sort((a, b) => parseDateForSort(a.date) - parseDateForSort(b.date) || a.distance - b.distance);
                    break;
                case 'price-low':
                    filtered.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
                    break;
                case 'price-high':
                    filtered.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
                    break;
            }

            return filtered;
        }

        function renderEvents() {
            const filtered = filterAndSortEvents();
            const grid = document.getElementById('events-grid');

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="icon">🎭</div>
                        <h3>No events found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
            } else {
                grid.innerHTML = filtered.map(createEventCard).join('');
            }

            document.getElementById('results-shown').textContent = filtered.length;
        }

        function updateCounts() {
            const bmsEvents = eventsData.filter(e => e.source === 'bookmyshow');
            const paytmEvents = eventsData.filter(e => e.source === 'paytm_insider');
            const weekEvents = eventsData.filter(e => isThisWeek(e.date));

            document.getElementById('total-count').textContent = eventsData.length;
            document.getElementById('bms-count').textContent = bmsEvents.length;
            document.getElementById('paytm-count').textContent = paytmEvents.length;
            document.getElementById('today-count').textContent = weekEvents.length;

            // Category counts
            document.getElementById('count-all').textContent = eventsData.length;
            document.getElementById('count-music').textContent = eventsData.filter(e => e.category.toLowerCase() === 'music').length;
            document.getElementById('count-comedy').textContent = eventsData.filter(e => e.category.toLowerCase() === 'comedy').length;
            document.getElementById('count-workshop').textContent = eventsData.filter(e => e.category.toLowerCase() === 'workshop').length;
            document.getElementById('count-theatre').textContent = eventsData.filter(e => e.category.toLowerCase() === 'theatre').length;
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderEvents();
            });
        });

        document.querySelectorAll('.source-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSource = btn.dataset.source;
                renderEvents();
            });
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderEvents();
        });

        document.getElementById('sort-select').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderEvents();
        });

        // Scroll to top button
        const scrollTopBtn = document.getElementById('scroll-top');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Initialize
        updateCounts();
        renderEvents();
    </script>
</body>

</html>
